name: CI

on:
  push:
    # This repository's default branch is `master`. `main` is listed too so the
    # workflow keeps running if the branch is ever renamed.
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite is offline and needs no credentials, so CI needs no secrets.
      - run: npm run verify
      - run: npm run build
